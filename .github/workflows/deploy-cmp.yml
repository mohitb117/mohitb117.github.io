name: Build Compose Multiplatform (Kotlin/Wasm) & Jekyll

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  build-cmp-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/Wasm Distribution & Copy to assets/cmp
        run: gradle :composeApp:deployWasmToJekyll --no-daemon

      - name: Upload Compiled Kotlin/Wasm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmp-wasm-dist
          path: assets/cmp/
